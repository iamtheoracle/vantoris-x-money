name: Recovery build check

on:
  push:
    branches: [recovery/merge-vantoris-live, migration/remove-base44-and-codex]
  pull_request:
    branches: [main, recovery/merge-vantoris-live]
  workflow_dispatch:

concurrency:
  group: recovery-build-${{ github.event.pull_request.number || github.ref }}
  # Let an active verification finish; only the newest pending PR check is retained.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check netlify/functions/ask.mjs
      - run: node --check netlify/functions/member-auth.mjs
      - run: node --check netlify/functions/staff-auth.mjs
      - run: node --check netlify/functions/staff-actions.mjs
      - run: node --check netlify/functions/member-documents.mjs
      - run: node --check netlify/functions/oracle.mjs
      - run: node --check scripts/apply-vantoris-migrations.mjs
      - run: node --test tests/migration-runner.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate and test Oracle runtime
        run: |
          deno check --node-modules-dir=auto base44/functions/oracleRuntime/entry.ts
          deno check --node-modules-dir=auto base44/functions/_shared/paymentStore.ts
          deno check --node-modules-dir=auto base44/functions/createTransferRequest/entry.ts
          deno check --node-modules-dir=auto base44/functions/reviewTransferRequest/entry.ts
          deno check --node-modules-dir=auto base44/functions/submitApprovedTransfer/entry.ts
          deno check --node-modules-dir=auto base44/functions/bankTransferWebhook/entry.ts
          deno check --node-modules-dir=auto base44/functions/syncPlaidTransferEvents/entry.ts
          deno check --node-modules-dir=auto base44/functions/reconcileBankTransfers/entry.ts
          deno check --node-modules-dir=auto base44/functions/recordIncomingBankReceipt/entry.ts
          deno check --node-modules-dir=auto base44/functions/recordManualTransferEvent/entry.ts
          deno test --node-modules-dir=auto --allow-env base44/shared/runtime/nexus.test.ts
          deno test --node-modules-dir=auto --allow-read=migrations,tests/postgres tests/private-payment-store.test.ts
          deno test --node-modules-dir=auto --allow-read=migrations tests/private-payment-migration.test.ts
          deno test --node-modules-dir=auto --allow-read=src/pages tests/financial-formatting.test.ts
          deno test --node-modules-dir=auto --allow-read=public/card-art,src/components/vantoris,src/pages,src/index.css tests/heritage-and-card-art.test.ts
          deno test --node-modules-dir=auto --allow-read=base44,src/lib,src/pages,src/components/vantoris,index.html,netlify/functions,docs,src/App.jsx tests/operational-truthfulness.test.ts
      - name: Verify first-party read-only Vantoris assistant boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const surfaces = [
            'src/components/vantoris/FloatingCommandDock.jsx',
            'src/components/vantoris/AgentChat.jsx',
            'src/pages/product/Ask.jsx',
            'src/pages/Home.jsx',
            'src/pages/Accounts.jsx',
            'src/pages/MoveMoney.jsx',
            'src/pages/Investment.jsx',
            'src/pages/operations/Approvals.jsx',
            'src/pages/operations/InvestmentDeposits.jsx',
            'src/pages/operations/InvestmentWithdrawals.jsx',
            'src/pages/operations/HeroBoxFundsShipping.jsx',
            'src/pages/operations/HeroBoxAdminOrders.jsx',
            'src/pages/operations/HeroBoxAdminProducts.jsx',
            'src/pages/operations/HeroBoxMissionControl.jsx',
            'src/pages/operations/HeroBoxCarePackages.jsx',
          ];
          for (const file of surfaces) {
            const source = readFileSync(file, 'utf8');
            if (source.includes('base44.agents.') || source.includes('/.netlify/functions/ask') || source.includes('/api/ask')) {
              throw new Error('Direct AI execution path found in ' + file);
            }
          }
          const client = readFileSync('src/lib/oracleAssistant.js', 'utf8');
          const adapter = readFileSync('src/lib/privateLlm.js', 'utf8');
          const server = readFileSync('netlify/functions/oracle.mjs', 'utf8');
          const legacyAsk = readFileSync('netlify/functions/ask.mjs', 'utf8');
          const chat = readFileSync('src/components/vantoris/AgentChat.jsx', 'utf8');
          if (!client.includes("fetch('/api/oracle'") || client.includes('base44') || client.includes("functions.invoke(")) {
            throw new Error('Browser assistant must use only the first-party Vantoris endpoint.');
          }
          if (!adapter.includes('askOracle') || adapter.includes('base44')) {
            throw new Error('Existing assistant adapters must use the shared Vantoris client.');
          }
          if (!legacyAsk.includes("import oracle from './oracle.mjs'") || legacyAsk.includes('@base44/sdk')) {
            throw new Error('Legacy ask route must remain a compatibility alias to the first-party endpoint.');
          }
          for (const marker of ['resolve_member_session', 'verify_auth_csrf', 'consume_member_assistant_request', 'VANTORIS_PRIVATE_LLM_URL', 'VANTORIS_PRIVATE_LLM_MODEL']) {
            if (!server.includes(marker)) throw new Error('Server assistant boundary is missing: ' + marker);
          }
          if (server.includes('@base44/sdk') || server.includes('BASE44_') || server.includes('UPSTASH_')) {
            throw new Error('Vantoris assistant must not depend on Base44 or an external usage store.');
          }
          if (chat.includes('base44') || chat.includes('executeElevatedCommand') || chat.includes('inspectCommandInput')) {
            throw new Error('Assistant UI must not authenticate through Base44 or execute elevated commands.');
          }
          if (existsSync('server/llm-proxy.mjs')) throw new Error('Obsolete standalone private-model proxy still exists');
          console.log('Vantoris assistant uses member authentication, database rate limits and an informational private-model endpoint only.');
          NODE
      - name: Prevent browser-side financial and privileged record mutations
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const surfaces = [
            'src/components/vantoris/FloatingCommandDock.jsx',
            'src/components/vantoris/HistoricalStatementImport.jsx',
            'src/components/vantoris/herobox/DiscoverFeed.jsx',
            'src/lib/discoveryEngine.js',
            'src/lib/discoveryPipeline.js',
            'src/lib/heroboxDiscovery.js',
            'src/pages/Home.jsx',
            'src/pages/Accounts.jsx',
            'src/pages/AccountDetail.jsx',
            'src/pages/MoveMoney.jsx',
            'src/pages/Investment.jsx',
            'src/pages/HeroBox.jsx',
            'src/pages/Discovery.jsx',
            'src/pages/admin/AdminOverview.jsx',
            'src/pages/admin/AdminMembers.jsx',
            'src/pages/admin/AdminApplications.jsx',
            'src/pages/admin/AdminKYC.jsx',
            'src/pages/admin/AdminAccounts.jsx',
            'src/pages/admin/AdminWithdrawals.jsx',
            'src/pages/operations/Approvals.jsx',
            'src/pages/operations/InvestmentDeposits.jsx',
            'src/pages/operations/InvestmentWithdrawals.jsx',
            'src/pages/operations/HeroBoxFundsShipping.jsx',
            'src/pages/operations/HeroBoxAdminOrders.jsx',
            'src/pages/operations/HeroBoxAdminProducts.jsx',
            'src/pages/operations/DiscoveryNetwork.jsx',
            'src/pages/operations/HumanitarianCases.jsx',
            'src/pages/operations/Organizations.jsx',
            'src/pages/operations/OperationsNotifications.jsx',
            'src/pages/operations/Referrals.jsx',
            'src/pages/operations/WithdrawalLimits.jsx',
            'src/pages/operations/BulkTransactionImport.jsx',
            'src/pages/operations/TransactionExportDashboard.jsx',
            'src/pages/operations/Deposits.jsx',
            'src/pages/operations/Transfers.jsx',
            'src/pages/operations/IncomingBankReceipts.jsx',
            'src/pages/operations/InvestmentPortfolios.jsx',
            'src/pages/operations/InvestmentSignals.jsx',
            'src/pages/operations/InvestmentDashboard.jsx',
            'src/pages/operations/Finance.jsx',
            'src/pages/operations/TransactionSummaries.jsx',
            'src/pages/operations/WithdrawalAuditLog.jsx',
            'src/pages/operations/SecurityComplianceDashboard.jsx',
            'src/pages/operations/AccountAssignment.jsx',
            'src/pages/operations/AuditLogs.jsx',
            'src/pages/Profile.jsx',
            'src/components/vantoris/profile/RelationshipOverview.jsx',
            'src/components/vantoris/profile/UnifiedTimeline.jsx',
            'src/components/vantoris/widgets/SecurityStatusWidget.jsx',
            'src/components/vantoris/widgets/LiveBankingActivity.jsx',
            'src/components/vantoris/home/AccountsSection.jsx',
          ];
          const directWrite = /base44\.entities\.(Account|Transaction|Document|WithdrawalRequest|PaymentCard|InvestmentPortfolio|InvestmentTransaction|InvestmentDepositRequest|InvestmentWithdrawalRequest|HeroBoxOrder|HeroBoxProduct|HeroBoxActivity|HeroBoxRequest|HeroBoxProfile|Application|User|Notification|HumanitarianCase|OrganizationProfile|DiscoveryRecord|DiscoveryRun|DiscoveryAlert|DiscoverySource|DiscoveryChange|NewsRecord|VolunteerProfile|WithdrawalLimit|Referral|AuditLog|TransactionExport|InvestmentSignal|IncomingBankReceipt|TransferRequest|TransferWebhookEvent)\.(create|update|delete|updateMany|bulkCreate|createMany|bulkUpdate|upsert)\s*\(/;
          const clientEmail = /base44\.integrations\.Core\.SendEmail\s*\(/;
          const clientLLM = /base44\.integrations\.Core\.InvokeLLM\s*\(/;
          for (const file of surfaces) {
            const source = readFileSync(file, 'utf8');
            if (directWrite.test(source)) {
              throw new Error('Browser-side financial or privileged record mutation found in ' + file);
            }
            if (clientEmail.test(source)) {
              throw new Error('Browser-side email delivery call found in ' + file);
            }
            if (clientLLM.test(source)) {
              throw new Error('Browser-side LLM discovery/action call found in ' + file);
            }
          }
          console.log('Critical member, admin, and discovery surfaces contain no direct privileged writes, browser-side email delivery, or browser-side LLM discovery.');
          NODE
      - name: Preserve internal transfers and keep unsupported financial claims evidence-bound
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const transfer = readFileSync('src/pages/MoveMoney.jsx', 'utf8');
          for (const marker of [
            "action: 'transfer'",
            "result.transfer?.status !== 'posted'",
            'result.transfer?.journalId',
            'idempotency_conflict',
            'This transfer does not use a sponsor bank, Plaid, ACH, Fedwire',
          ]) {
            if (!transfer.includes(marker)) throw new Error('Core internal transfer contract is missing: ' + marker);
          }
          if (/fetch\(\s*['"]https?:\/\//i.test(transfer)) {
            throw new Error('Internal transfer page must not call an external payment API directly');
          }
          const investment = readFileSync('src/pages/Investment.jsx', 'utf8');
          if (!investment.includes('No investment balance is currently available') ||
              !investment.includes('verified the underlying asset records') ||
              !investment.includes('No third-party portfolio figure is treated as a Vantoris balance') ||
              /\$[0-9]|€[0-9]|£[0-9]/.test(investment)) {
            throw new Error('Investment screen must not represent unverified holdings as Vantoris balances');
          }
          const readOnlySurfaces = [
            ['src/pages/AccountDetail.jsx', 'Account detail must not write financial records from the browser'],
            ['src/pages/admin/AdminAccounts.jsx', 'Admin account screens must not contain direct financial mutations'],
            ['src/pages/admin/AdminWithdrawals.jsx', 'Withdrawal operations must remain read-only until an authorized server workflow exists'],
          ];
          for (const [file, reason] of readOnlySurfaces) {
            const source = readFileSync(file, 'utf8');
            if (/base44\.entities\.(Account|Transaction|WithdrawalRequest)\.(create|update|delete|updateMany|bulkCreate|bulkUpdate)\s*\(/.test(source)) {
              throw new Error(reason + ': direct mutation found in ' + file);
            }
          }
          console.log('Session-bound internal transfers remain available; unverified investment and direct browser writes remain guarded.');
          NODE
      - name: Validate entity JSON and security rules
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          const dir = 'base44/entities';
          const files = readdirSync(dir).filter((name) => name.endsWith('.jsonc'));
          if (!files.length) throw new Error('No entity schemas found');
          for (const file of files) {
            const schema = JSON.parse(readFileSync(`${dir}/${file}`, 'utf8'));
            if (!schema.name || schema.type !== 'object') throw new Error(`Invalid entity schema: ${file}`);
          }
          const schemas = Object.fromEntries(
            ['Account', 'Transaction', 'WithdrawalRequest', 'TransferRequest', 'TransferWebhookEvent', 'IncomingBankReceipt', 'Notification', 'User', 'PaymentCard'].map((name) => {
              const schema = JSON.parse(readFileSync(`${dir}/${name}.jsonc`, 'utf8'));
              if (!schema.rls) throw new Error(`Missing row-level security rules: ${name}`);
              return [name, schema];
            })
          );
          for (const name of ['Account', 'Transaction', 'WithdrawalRequest', 'PaymentCard']) {
            const rls = schemas[name].rls;
            for (const action of ['create', 'update', 'delete']) {
              if (rls[action] !== false) throw new Error(`${name}.${action} must remain denied to direct clients`);
            }
          }
          for (const name of ['TransferRequest', 'TransferWebhookEvent', 'IncomingBankReceipt']) {
            const rls = schemas[name].rls;
            for (const action of ['create', 'update']) {
              if (rls[action]?.user_condition?.role !== 'admin') {
                throw new Error(`${name}.${action} must be restricted to the Base44 admin service role`);
              }
            }
            if (rls.delete !== false) throw new Error(`${name}.delete must remain denied`);
          }
          for (const action of ['create', 'read', 'update', 'delete']) {
            const rule = schemas.Notification.rls[action];
            const clauses = Array.isArray(rule?.$or) ? rule.$or : [rule];
            const ownerScoped = clauses.some((clause) => clause['data.user_id'] === '{{user.id}}');
            const adminScoped = clauses.some((clause) => clause.user_condition?.role === 'admin');
            if (!ownerScoped || !adminScoped) {
              throw new Error(`Notification.${action} must be owner-scoped with admin service access`);
            }
          }
          if (!schemas.Transaction.rls.read || !schemas.Account.rls.read) {
            throw new Error('Account and Transaction read policies must remain explicitly defined');
          }
          if (schemas.PaymentCard.rls.read?.['data.user_id'] !== '{{user.id}}') {
            throw new Error('PaymentCard.read must remain owner-scoped');
          }
                    const transfer = schemas.TransferRequest;
          for (const status of ['awaiting_dual_approval', 'approved_awaiting_bank_submission', 'submitted_to_bank', 'pending_settlement', 'settled', 'rejected']) {
            if (!transfer.properties.status.enum.includes(status)) throw new Error(`Missing transfer status: ${status}`);
          }
          console.log(`Validated ${files.length} entity schemas, denied client financial writes, and owner-scoped notification access.`);
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
