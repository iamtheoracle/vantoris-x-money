name: Vantoris institutional ledger PostgreSQL

on:
  push:
    branches: [migration/remove-base44-and-codex]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vantoris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vantoris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VANTORIS_LEDGER_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/vantoris_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Provision separate runtime login and legacy privilege group
        run: |
          psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE vantoris_backend NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;"
          psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE avcu_backend LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci-only-runtime-password';"
          psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "GRANT vantoris_backend TO avcu_backend;"
      - name: Apply and verify ordered Vantoris migrations with SHA-256 history
        run: |
          node scripts/apply-vantoris-migrations.mjs
          node scripts/apply-vantoris-migrations.mjs --verify-only
      - name: Generate runtime migration manifest for server function tests
        run: node scripts/generate-vantoris-migration-manifest.mjs
      - name: Verify avcu_backend inherits restricted ledger privileges
        run: |
          psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT pg_has_role('avcu_backend', 'vantoris_backend', 'USAGE') THEN
              RAISE EXCEPTION 'avcu_backend does not inherit vantoris_backend grants';
            END IF;
            IF NOT has_schema_privilege('avcu_backend', 'vantoris_ledger', 'USAGE') THEN
              RAISE EXCEPTION 'avcu_backend lacks ledger schema usage';
            END IF;
            IF NOT has_table_privilege('avcu_backend', 'vantoris_ledger.members', 'SELECT') THEN
              RAISE EXCEPTION 'avcu_backend lacks member read access';
            END IF;
            IF has_table_privilege('avcu_backend', 'vantoris_ledger.journals', 'INSERT')
              OR has_table_privilege('avcu_backend', 'vantoris_ledger.journal_entries', 'INSERT')
              OR has_table_privilege('avcu_backend', 'vantoris_ledger.audit_events', 'UPDATE')
              OR has_table_privilege('avcu_backend', 'vantoris_ledger.audit_events', 'DELETE') THEN
              RAISE EXCEPTION 'avcu_backend has direct ledger or audit mutation privileges';
            END IF;
            IF NOT has_function_privilege('avcu_backend',
              'vantoris_ledger.execute_member_internal_transfer(uuid,bytea)', 'EXECUTE') THEN
              RAISE EXCEPTION 'avcu_backend cannot execute the session-bound internal transfer function';
            END IF;
          END $verify$;
          SQL
      - name: Run disposable PostgreSQL ledger integration test
        run: psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/vantoris-ledger.integration.sql
      - name: Seed disposable concurrent-transfer fixtures
        run: psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/transfer-concurrency-seed.sql
      - name: Test concurrent transfers and forced hold rollback
        run: node --test tests/postgres/transfer-concurrency.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Vantoris member auth function syntax
        run: node --check netlify/functions/member-auth.mjs
      - name: Check Vantoris staff API syntax
        run: node --check netlify/functions/staff-auth.mjs && node --check netlify/functions/staff-actions.mjs
      - name: Run Vantoris member auth cryptography tests
        run: node --test tests/member-auth.test.mjs
      - name: Run Vantoris migration contract tests
        run: |
          deno test --allow-read=migrations tests/private-payment-migration.test.ts
          deno test --allow-read=migrations,tests/postgres tests/private-payment-store.test.ts
