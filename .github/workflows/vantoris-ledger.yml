name: Vantoris institutional ledger PostgreSQL

on:
  push:
    branches: [migration/remove-base44-and-codex]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vantoris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vantoris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VANTORIS_LEDGER_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/vantoris_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create restricted application role
        run: |
          psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE vantoris_backend LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci-only-runtime-password';"
      - name: Apply Vantoris migrations in order
        run: |
          for migration in \
            migrations/001_avcu_payment_control_plane.sql \
            migrations/002_avcu_backend_grants.sql \
            migrations/003_avcu_outgoing_funds_holds.sql \
            migrations/004_avcu_payment_audit_hardening.sql \
            migrations/005_avcu_payment_outbox_claims.sql \
            migrations/006_vantoris_identity_and_sessions.sql \
            migrations/007_vantoris_session_rls.sql \
            migrations/008_vantoris_auth_rate_limits.sql \
            migrations/009_vantoris_staff_controls.sql \
            migrations/010_vantoris_permanent_capital_protection.sql \
            migrations/011_vantoris_approved_journal_posting.sql \
            migrations/012_vantoris_member_transfer_limits.sql \
            migrations/013_vantoris_member_activation_mfa.sql \
            migrations/014_vantoris_staff_profile.sql
          do
            psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run disposable PostgreSQL ledger integration test
        run: psql "$VANTORIS_LEDGER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/vantoris-ledger.integration.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Vantoris member auth function syntax
        run: node --check netlify/functions/member-auth.mjs
      - name: Check Vantoris staff API syntax
        run: node --check netlify/functions/staff-auth.mjs && node --check netlify/functions/staff-actions.mjs
      - name: Run Vantoris member auth cryptography tests
        run: node --test tests/member-auth.test.mjs
      - name: Run Vantoris migration contract tests
        run: |
          deno test --allow-read=migrations tests/private-payment-migration.test.ts
          deno test --allow-read=migrations,tests/postgres tests/private-payment-store.test.ts
